<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysioSim: Interactive Sarcomere Dynamics</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-actin: #f43f5e;
            --accent-myosin: #3b82f6;
            --accent-ca: #22c55e;
            --accent-atp: #eab308;
            --border-color: #334155;
            
            /* Dynamic Physics Handles managed via JavaScript */
            --sarcomere-width: 80%;
            --actin-displace: 0px;
            --myosin-angle: 0deg;
            --tropomyosin-color: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 4px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .simulation-pane {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Pure CSS Simulation Environment Viewport */
        .simulation-viewport {
            position: relative;
            width: 100%;
            height: 400px;
            background: #0b0f19;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sarcomere structural architecture container */
        .sarcomere-structure {
            position: relative;
            width: var(--sarcomere-width);
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: width 0.1s linear;
        }

        /* Z-Disc Lines */
        .z-disc {
            position: absolute;
            width: 6px;
            height: 100%;
            background-color: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            z-index: 10;
        }
        .z-disc.left { left: 0; }
        .z-disc.right { right: 0; }
        .z-disc-label {
            position: absolute;
            top: -20px;
            left: -18px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: bold;
            font-family: monospace;
        }

        /* M-Line Center Anchor */
        .m-line {
            position: absolute;
            width: 4px;
            height: 70%;
            background-color: rgba(255,255,255,0.15);
            border-left: 2px dashed rgba(255,255,255,0.3);
            z-index: 1;
        }
        .m-line-label {
            position: absolute;
            top: 25px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: bold;
            font-family: monospace;
            white-space: nowrap;
        }

        /* Myosin Thick Filament Center-Mass */
        .thick-filament {
            position: absolute;
            width: 60%;
            height: 16px;
            background: linear-gradient(90deg, #1d4ed8, #3b82f6, #1d4ed8);
            border-radius: 4px;
            z-index: 2;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Molecular Myosin Intercept Cross-Bridge Heads */
        .myosin-heads-group {
            position: absolute;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
        }
        .myosin-head-pair {
            position: relative;
            width: 12px;
            height: 100%;
        }
        .head-node {
            position: absolute;
            width: 8px;
            height: 22px;
            background-color: var(--accent-myosin);
            border-radius: 4px;
            transform-origin: center center;
            transform: rotate(var(--myosin-angle));
            transition: transform 0.05s linear;
        }
        .head-node.top { top: 10px; }
        .head-node.bottom { bottom: 10px; }

        /* Actin Thin Filaments strands connected to Z-Discs */
        .thin-filaments-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .actin-strand {
            position: absolute;
            width: 45%;
            height: 4px;
            background-color: var(--accent-actin);
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(244, 63, 94, 0.4);
            border-bottom: 2px solid var(--tropomyosin-color);
        }
        .actin-strand.left-top { left: 6px; top: 48px; transform: translateX(var(--actin-displace)); }
        .actin-strand.left-bottom { left: 6px; bottom: 48px; transform: translateX(var(--actin-displace)); }
        .actin-strand.right-top { right: 6px; top: 48px; transform: translateX(calc(-1 * var(--actin-displace))); }
        .actin-strand.right-bottom { right: 6px; bottom: 48px; transform: translateX(calc(-1 * var(--actin-displace))); }

        /* Interface controls custom styles */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            background: rgba(15, 23, 42, 0.4);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
        }

        .control-group label .val {
            font-family: monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
        }

        #calciumRange::-webkit-slider-thumb { background: var(--accent-ca); }
        #atpRange::-webkit-slider-thumb { background: var(--accent-atp); }

        .dashboard-pane {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .status-badge {
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            line-height: 1.4;
            border-left: 4px solid #64748b;
            background: rgba(15, 23, 42, 0.3);
        }

        .status-badge.active-state {
            border-left-color: var(--accent-myosin);
        }

            display: flex;
            flex-direction: column;

;} else {stateBadge.className = "status-badge active-state";stateBadge.innerHTML = <strong>Active Cross-Bridge Cycling:</strong> Ca²⁺ uncovers binding sites. Myosin actively hydrolyzes ATP to generate directional tension towards center.;root.style.setProperty('--tropomyosin-color', '#475569');runtime.ticker += 0.05 * runtime.atp * runtime.ca;let wave = Math.sin(runtime.ticker);let headAngle = Math.sin(runtime.ticker * 2) * 20;root.style.setProperty('--myosin-angle', ${headAngle}deg);let targetWidth = 85 - (Math.max(0, wave) * 25 * runtime.ca);runtime.currentWidth += (targetWidth - runtime.currentWidth) * 0.05;}root.style.setProperty('--sarcomere-width', ${runtime.currentWidth}%);requestAnimationFrame(simulationStep);} //Initialize Runtime Engine InstantlysimulationStep();
